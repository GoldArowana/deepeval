name: DeepEval 3418 exact source validation f14b7f79

on:
  push:
    branches:
      - codex-deepeval-3418-validation-f14b7f79
    paths:
      - .github/workflows/codex-deepeval-3418-validation-f14b7f79.yml

permissions:
  contents: read

jobs:
  focused-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      VALIDATION_REF: refs/heads/codex-deepeval-3418-validation-f14b7f79
      EXPECTED_FORK_BASE: a200ecede6456f92d7cbbb350b7b3fb4d78d36b3
      SOURCE_HEAD: 50715ef6e5def978d2e96b14d881bc865787a76b
      SOURCE_TREE: 32354c78afd83a169c65a0bca43f020d9d730a26
      SOURCE_PUBLIC_PARENT: ea01954104bc30db8d47a98c7dc86fe1077bf77c
      SOURCE_UPSTREAM_PARENT: dee2d7a077f3598cfdb9b3a58f1887c919829294
      SOURCE_UPSTREAM_TREE: f77a9de837902f5f82bfad39f90c5241aeed516b
      SOURCE_MERGE_BASE: 5410e3822dda5f889d5f35de3325a3738004aeb1
      SOURCE_UPSTREAM_API_BLOB: 4ea9a3624733ace487c72771011896a633a3f761
      SOURCE_LOCK_BLOB: 071be68f6eeef42f9ca5938c5d67f7d414d76949
      SOURCE_COMMIT_BASE64: ""
      GIT_TERMINAL_PROMPT: "0"
      POETRY_VIRTUALENVS_CREATE: "true"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"
      DEEPEVAL_DISABLE_DOTENV: "1"
      CONFIDENT_OPEN_BROWSER: "0"
    steps:
      - name: Reconstruct and prove the exact source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = "$VALIDATION_REF"
          test "${GITHUB_REPOSITORY,,}" = goldarowana/deepeval
          validation_proof="$RUNNER_TEMP/deepeval-3418-validation-event"
          source_checkout="$RUNNER_TEMP/deepeval-3418-source"
          git init "$validation_proof"
          git -C "$validation_proof" fetch --depth=2 --no-tags --no-recurse-submodules https://github.com/GoldArowana/deepeval.git "$VALIDATION_REF:refs/heads/event-proof"
          test "$(git -C "$validation_proof" rev-parse refs/heads/event-proof)" = "$GITHUB_SHA"
          test "$(git -C "$validation_proof" rev-parse "$GITHUB_SHA^1")" = "$EXPECTED_FORK_BASE"
          expected_workflow=".github/workflows/codex-deepeval-3418-validation-f14b7f79.yml"
          test "$(git -C "$validation_proof" diff --name-only "$EXPECTED_FORK_BASE" "$GITHUB_SHA")" = "$expected_workflow"

          git init "$source_checkout"
          cd "$source_checkout"
          git remote add upstream https://github.com/confident-ai/deepeval.git
          git remote add author https://github.com/GoldArowana/deepeval.git
          git fetch --no-tags --no-recurse-submodules upstream "$SOURCE_UPSTREAM_PARENT:refs/remotes/upstream/verified-main"
          git fetch --no-tags --no-recurse-submodules author refs/heads/fix/retrieved-context-image-mapping:refs/remotes/author/recorded-pr-head
          test "$(git rev-parse refs/remotes/author/recorded-pr-head)" = "$SOURCE_PUBLIC_PARENT"
          test "$(git rev-parse "$SOURCE_UPSTREAM_PARENT^{tree}")" = "$SOURCE_UPSTREAM_TREE"
          test "$(git merge-base "$SOURCE_PUBLIC_PARENT" "$SOURCE_UPSTREAM_PARENT")" = "$SOURCE_MERGE_BASE"
          git checkout --detach "$SOURCE_PUBLIC_PARENT"

          merge_rc=0
          git -c user.name='Exact source validator' -c user.email='source-validator@users.noreply.github.com' merge --no-ff --no-commit "$SOURCE_UPSTREAM_PARENT" || merge_rc=$?
          test "$merge_rc" = 1
          api_path=deepeval/test_run/api.py
          test "$(git diff --name-only --diff-filter=U)" = "$api_path"
          git restore --source="$SOURCE_UPSTREAM_PARENT" --staged --worktree -- "$api_path"
          test "$(git rev-parse ":$api_path")" = "$SOURCE_UPSTREAM_API_BLOB"
          test -z "$(git ls-files --unmerged)"
          git diff --cached --check "$SOURCE_UPSTREAM_PARENT"
          test "$(git write-tree)" = "$SOURCE_TREE"
          reconstructed_head="$(printf '%s' "$SOURCE_COMMIT_BASE64" | base64 -d | git hash-object -w -t commit --stdin)"
          test "$reconstructed_head" = "$SOURCE_HEAD"
          git reset --hard "$reconstructed_head"
          test "$(git rev-parse HEAD 'HEAD^{tree}' 'HEAD^1' 'HEAD^2' | paste -sd ' ' -)" = "$SOURCE_HEAD $SOURCE_TREE $SOURCE_PUBLIC_PARENT $SOURCE_UPSTREAM_PARENT"
          test "$(git rev-parse HEAD:poetry.lock)" = "$SOURCE_LOCK_BLOB"
          test "$(git rev-parse "HEAD:$api_path")" = "$SOURCE_UPSTREAM_API_BLOB"
          git diff HEAD --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          printf 'source repository: confident-ai/deepeval and GoldArowana/deepeval\nsource HEAD: %s\nsource tree: %s\nevent HEAD: %s\n' "$SOURCE_HEAD" "$SOURCE_TREE" "$GITHUB_SHA"

      - name: Set up upstream Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install the pinned tool and locked dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/deepeval-3418-source"
          python --version
          python -m pip --isolated install --disable-pip-version-check --no-input 'poetry==2.2.1' 'black[jupyter]==25.12.0'
          poetry --version
          poetry check --lock
          poetry install --no-interaction --no-root --only main
          poetry install --no-interaction --only main
          poetry install --no-interaction --with dev
          git diff HEAD --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Run focused serialization and SQLite tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/deepeval-3418-source"
          clean_home="$RUNNER_TEMP/deepeval-3418-local-home"
          mkdir -p "$clean_home"
          test ! -e .env
          offline() {
            sudo -n unshare --net -- /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" --init-groups -- /usr/bin/env -i               PATH="$PATH" HOME="$clean_home" POETRY_VIRTUALENVS_CREATE=true POETRY_VIRTUALENVS_IN_PROJECT=true               CI=true DEEPEVAL_TELEMETRY_OPT_OUT=1 DEEPEVAL_DISABLE_DOTENV=1 CONFIDENT_OPEN_BROWSER=0 COLUMNS=80 "$@"
          }
          target_tests=(
            tests/test_core/test_test_case/test_single_turn.py
            tests/test_core/test_test_case/test_multi_turn/test_conversational_test_case.py
            tests/test_core/test_sqlite_store.py
          )
          offline poetry run pytest --collect-only -q -p no:cacheprovider "${target_tests[@]}" | tee "$RUNNER_TEMP/deepeval-3418-test-collection.txt"
          collection="$RUNNER_TEMP/deepeval-3418-test-collection.txt"
          test "$(grep -c '::test_retrieval_context_images_propagate_to_api_test_case\[' "$collection")" = 2
          test "$(grep -c '::test_mixed_retrieval_context_images_are_collected_once$' "$collection")" = 1
          test "$(grep -c '::test_text_only_retrieval_context_has_no_image_mapping\[' "$collection")" = 2
          test "$(grep -c '::test_storage_failure_is_a_warning_not_an_error$' "$collection")" = 1
          offline poetry run pytest -vv -rA --maxfail=1 --capture=tee-sys -p no:cacheprovider             --basetemp "$RUNNER_TEMP/deepeval-3418-pytest" "${target_tests[@]}"
          offline python -m black --version
          offline python -m black --check --verbose --workers 1             deepeval/test_case/conversational_test_case.py deepeval/test_case/llm_test_case.py             deepeval/test_run/test_run.py tests/test_core/test_test_case/test_single_turn.py

      - name: Always recheck the source object and worktree
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/deepeval-3418-source"
          test "$(git rev-parse HEAD 'HEAD^{tree}' 'HEAD^1' 'HEAD^2' | paste -sd ' ' -)" = "$SOURCE_HEAD $SOURCE_TREE $SOURCE_PUBLIC_PARENT $SOURCE_UPSTREAM_PARENT"
          git diff HEAD --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          printf 'verified clean source HEAD: %s\nverified source tree: %s\n' "$SOURCE_HEAD" "$SOURCE_TREE"
